spring.application.name=gurukul-backend
# Override on AWS: SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Dev-only default secret (32+ bytes for HS256) - MUST be overridden via APP_JWT_SECRET env var in production.
app.jwt.secret=${APP_JWT_SECRET:dev-only-insecure-secret-change-me-before-prod-32bytes!}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:1440}

# Ops-only shared secret gating POST /api/v1/ops/admin-backfill - MUST be overridden via
# OPS_BACKFILL_KEY env var in production and kept out of source control/logs.
app.ops.backfill-key=${OPS_BACKFILL_KEY:dev-only-ops-key-change-me-before-prod}

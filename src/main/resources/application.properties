spring.application.name=gurukul-backend
# Override on AWS: SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Auto-clears failed migration entries before retrying, so a fixed-forward migration file
# doesn't get permanently blocked by a prior failed attempt still recorded in schema history.
spring.flyway.repair-on-migrate=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Dev-only default secret (32+ bytes for HS256) - MUST be overridden via APP_JWT_SECRET env var in production.
app.jwt.secret=${APP_JWT_SECRET:dev-only-insecure-secret-change-me-before-prod-32bytes!}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:1440}

# Ops-only shared secret gating POST /api/v1/ops/admin-backfill - MUST be overridden via
# OPS_BACKFILL_KEY env var in production and kept out of source control/logs.
app.ops.backfill-key=${OPS_BACKFILL_KEY:dev-only-ops-key-change-me-before-prod}

# Helpdesk BOT (Anthropic Claude) - Chat Integration. No default for the API key - a missing key
# must fail loudly/gracefully (BotReplyService checks properties.isConfigured() before ever calling
# the client), never silently "work" the way app.jwt.secret's dev placeholder does.
# app.anthropic.backend: "direct" (default, uses api-key against the Anthropic API) or "bedrock"
# (uses AWS credentials - e.g. the EC2 instance role - via the AWS Bedrock runtime instead).
app.anthropic.backend=${APP_ANTHROPIC_BACKEND:direct}
app.anthropic.api-key=${ANTHROPIC_API_KEY:}
app.anthropic.model=${APP_ANTHROPIC_MODEL:claude-opus-5}
app.anthropic.effort=${APP_ANTHROPIC_EFFORT:MEDIUM}
app.anthropic.max-output-tokens=${APP_ANTHROPIC_MAX_OUTPUT_TOKENS:1024}
app.anthropic.max-tool-iterations=${APP_ANTHROPIC_MAX_TOOL_ITERATIONS:5}
app.anthropic.history-window=${APP_ANTHROPIC_HISTORY_WINDOW:20}

# Battle Rooms (Gamification Phase 4b) - live, multiplayer fastest-buzz-first quiz battles.
app.gamification.battle-room.min-players=${APP_BATTLE_ROOM_MIN_PLAYERS:2}
app.gamification.battle-room.max-players=${APP_BATTLE_ROOM_MAX_PLAYERS:5}
app.gamification.battle-room.join-window-seconds=${APP_BATTLE_ROOM_JOIN_WINDOW_SECONDS:60}
app.gamification.battle-room.question-count=${APP_BATTLE_ROOM_QUESTION_COUNT:10}
app.gamification.battle-room.question-timeout-seconds=${APP_BATTLE_ROOM_QUESTION_TIMEOUT_SECONDS:15}
app.gamification.battle-room.win-xp=${APP_BATTLE_ROOM_WIN_XP:10}

# Jitsi moderator bot (fixes meet.jit.si's Aug-2023 policy: a brand-new room needs an
# authenticated participant to "start" it, or every caller hits "waiting for moderator" - see
# docs/jitsi-bot-setup.md). Disabled by default - a missing/blank profile-dir is a safe no-op,
# same fail-open-to-current-behavior pattern as app.anthropic above. The one-time authenticated
# login itself is a manual step a human must do; this only replays that saved session headlessly.
app.jitsi.bot.enabled=${JITSI_BOT_ENABLED:false}
app.jitsi.bot.base-url=${JITSI_BOT_BASE_URL:https://meet.jit.si}
app.jitsi.bot.profile-dir=${JITSI_BOT_PROFILE_DIR:}
app.jitsi.bot.chrome-binary=${JITSI_BOT_CHROME_BINARY:}
app.jitsi.bot.chromedriver-path=${JITSI_BOT_CHROMEDRIVER_PATH:}
app.jitsi.bot.warm-timeout-seconds=${JITSI_BOT_WARM_TIMEOUT_SECONDS:20}

# Chat attachments (images/PDFs) - presigned S3 upload. Bucket has no default - a blank bucket
# must fail loudly (AttachmentService checks properties.isConfigured() before ever presigning),
# same pattern as app.anthropic.api-key above. AWS credentials resolved via the default provider
# chain (the EC2 instance role in prod, ~/.aws/credentials locally) - same as app.anthropic's
# bedrock backend.
app.chat.attachments.bucket=${APP_CHAT_ATTACHMENTS_BUCKET:}
app.chat.attachments.region=${AWS_REGION:eu-north-1}
app.chat.attachments.max-file-size-bytes=${APP_CHAT_ATTACHMENTS_MAX_FILE_SIZE_BYTES:10485760}
app.chat.attachments.allowed-content-types=${APP_CHAT_ATTACHMENTS_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/gif,image/webp,application/pdf}
app.chat.attachments.upload-expiry-seconds=${APP_CHAT_ATTACHMENTS_UPLOAD_EXPIRY_SECONDS:300}
app.chat.attachments.download-expiry-seconds=${APP_CHAT_ATTACHMENTS_DOWNLOAD_EXPIRY_SECONDS:3600}

# Database provider switch - see com.gurukul.config.DataSourceConfig for the two DataSource
# beans this selects between:
#   DB_PROVIDER=supabase (default) - Supabase-managed Postgres, plain username/password over
#     TLS. Also needs SPRING_DATASOURCE_PASSWORD (unused by the aurora branch).
#     JDBC URL example: jdbc:postgresql://db.<project-ref>.supabase.co:5432/postgres?sslmode=require
#   DB_PROVIDER=aurora - AWS Aurora Postgres, IAM auth via AWS Advanced JDBC Wrapper. Required
#     when Internet Access Gateway is enabled (password auth from the internet is rejected). No
#     DB password - the wrapper generates IAM tokens from the AWS credential chain (ECS task
#     role, ~/.aws/credentials locally, CloudShell admin session, etc.). IAM user/role needs
#     rds-db:connect on arn:aws:rds-db:REGION:ACCOUNT:dbuser:CLUSTER_RESOURCE_ID/postgres.
#     JDBC URL example: jdbc:aws-wrapper:postgresql://cluster-host:5432/postgres?sslmode=require
#
# Both providers read SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME - switching is just
# changing DB_PROVIDER plus the matching connection details, no code change or rebuild.
# In production, all of DB_PROVIDER / SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD are pushed
# into /etc/gurukul/backend.env on every deploy from GitHub Secrets - see .github/workflows/deploy.yml.
app.database.provider=${DB_PROVIDER:supabase}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway runs migrations on startup against RDS. The "seed" location holds Postgres-only mock/demo
# data migrations (e.g. gen_random_uuid()/generate_series/LATERAL) that H2 can't run, so it's only
# added here, never in the base/local locations CI and local dev use.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# Behind ALB / reverse proxy
server.forward-headers-strategy=framework
server.port=${PORT:8080}
server.shutdown=graceful

# Health checks for ECS / App Runner / ALB
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Disable dev tooling in production
spring.h2.console.enabled=false
# Swagger / OpenAPI (enabled in production for API testing)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.gurukul=INFO
logging.level.org.hibernate.SQL=WARN

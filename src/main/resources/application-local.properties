spring.datasource.url=jdbc:h2:mem:gurukul;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Example school UUID for local Swagger / curl (seeded in Flyway)
gurukul.dev.school-id=11111111-1111-1111-1111-111111111111

# Dev-only AES-256 key for TokenCipher (H2 is in-memory and wiped on restart anyway) - never reuse
# this value outside local dev. Real environments must set APP_ENCRYPTION_KEY themselves.
app.security.encryption-key=1fmF76ogFetJiJ5MLkZZaPT3wlXMpeDxmUMxqoQYptU=

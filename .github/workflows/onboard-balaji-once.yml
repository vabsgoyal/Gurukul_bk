name: Onboard Balaji Vidhyapeeth Unhel (one-off, production)

# Temporary, one-off workflow: registers Balaji Vidhyapeeth Unhel and bulk-imports its student
# roster against the production backend, run from a GitHub-hosted runner since this task's dev
# environment has no network path to production but this runner does (confirmed via the Deploy
# workflow's own smoke-test step reaching the same host). Deliberately manual-trigger only, and
# deliberately removed from the repo again once it has run successfully - see
# specs/onboard-balaji-vidhyapeeth-unhel/spec.md in the Gurukul workspace root for the full story.

on:
  workflow_dispatch:

jobs:
  onboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Run onboarding import against production
        env:
          GURUKUL_BASE_URL: http://13.60.11.238:8080
        run: python tools/onboarding/run_import.py

      - name: Upload import report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balaji-import-report
          path: tools/onboarding/import_report.json
          if-no-files-found: warn

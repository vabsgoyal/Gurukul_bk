name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # S3 deploy-artifact bucket's region - unchanged, only the EC2 instance moved (see EC2_REGION).
  AWS_REGION: eu-north-1
  # Where the EC2 instance / SSM target actually lives - kept separate from AWS_REGION since the
  # two diverged when the instance moved to ap-south-1 but the S3 bucket didn't.
  EC2_REGION: ap-south-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - run: mvn clean test -q

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build JAR and upload to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_JAR_KEY: ${{ secrets.S3_JAR_KEY }}
        run: |
          mvn package -DskipTests -q
          aws s3 cp target/gurukul-backend-0.0.1-SNAPSHOT.jar \
            "s3://${S3_BUCKET}/${S3_JAR_KEY}" \
            --region "${AWS_REGION}"
          aws s3 cp target/gurukul-backend-0.0.1-SNAPSHOT.jar \
            "s3://${S3_BUCKET}/releases/gurukul-backend-${GITHUB_SHA}.jar" \
            --region "${AWS_REGION}"

      - name: Deploy to EC2 via SSM
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DB_PROVIDER: ${{ secrets.DB_PROVIDER }}
          DS_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          DS_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          DS_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
        run: |
          # Always push the repo's deploy-from-s3.sh to the instance before running it, so the
          # instance can never silently drift from what's committed (it previously did - a stale
          # copy with a flat "sleep 25" instead of a real health-check retry loop caused
          # intermittent false-failures on this exact step for several deploys).
          SCRIPT_B64=$(base64 -w0 deploy/aws/deploy-from-s3.sh)

          # DB_PROVIDER/datasource secrets are base64-wrapped before embedding in the SSM command
          # (same reasoning as SCRIPT_B64 above) - a DB password is exactly the kind of value
          # that can contain quotes/$/backticks, which would otherwise corrupt or inject into the
          # remote shell command built below.
          DB_PROVIDER_B64=$(printf '%s' "$DB_PROVIDER" | base64 -w0)
          DS_URL_B64=$(printf '%s' "$DS_URL" | base64 -w0)
          DS_USERNAME_B64=$(printf '%s' "$DS_USERNAME" | base64 -w0)
          DS_PASSWORD_B64=$(printf '%s' "$DS_PASSWORD" | base64 -w0)

          COMMANDS=$(jq -n \
            --arg key "$ANTHROPIC_API_KEY" \
            --arg provider "$DB_PROVIDER_B64" \
            --arg url "$DS_URL_B64" \
            --arg username "$DS_USERNAME_B64" \
            --arg password "$DS_PASSWORD_B64" \
            --arg script "$SCRIPT_B64" '[
            "sudo sed -i /^ANTHROPIC_API_KEY=/d /etc/gurukul/backend.env",
            "echo \"ANTHROPIC_API_KEY=\($key)\" | sudo tee -a /etc/gurukul/backend.env >/dev/null",
            "sudo sed -i /^DB_PROVIDER=/d /etc/gurukul/backend.env",
            "echo \"DB_PROVIDER=$(echo \($provider) | base64 -d)\" | sudo tee -a /etc/gurukul/backend.env >/dev/null",
            "sudo sed -i /^SPRING_DATASOURCE_URL=/d /etc/gurukul/backend.env",
            "echo \"SPRING_DATASOURCE_URL=$(echo \($url) | base64 -d)\" | sudo tee -a /etc/gurukul/backend.env >/dev/null",
            "sudo sed -i /^SPRING_DATASOURCE_USERNAME=/d /etc/gurukul/backend.env",
            "echo \"SPRING_DATASOURCE_USERNAME=$(echo \($username) | base64 -d)\" | sudo tee -a /etc/gurukul/backend.env >/dev/null",
            "sudo sed -i /^SPRING_DATASOURCE_PASSWORD=/d /etc/gurukul/backend.env",
            "echo \"SPRING_DATASOURCE_PASSWORD=$(echo \($password) | base64 -d)\" | sudo tee -a /etc/gurukul/backend.env >/dev/null",
            "echo \($script) | base64 -d | sudo tee /opt/gurukul/deploy-from-s3.sh >/dev/null",
            "sudo chmod +x /opt/gurukul/deploy-from-s3.sh",
            "/opt/gurukul/deploy-from-s3.sh"
          ]')
          PARAMS=$(jq -n --argjson cmds "$COMMANDS" '{commands: $cmds}')

          aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Gurukul JAR deploy ${GITHUB_SHA}" \
            --parameters "$PARAMS" \
            --region "${EC2_REGION}" \
            --output text \
            --query 'Command.CommandId' > command_id.txt

          COMMAND_ID=$(cat command_id.txt)
          echo "SSM CommandId: $COMMAND_ID"

          for i in $(seq 1 36); do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --details \
              --query 'CommandInvocations[0].Status' \
              --output text \
              --region "${EC2_REGION}")
            echo "Status: $STATUS"
            if [[ "$STATUS" == "Success" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --region "${EC2_REGION}" \
                --query '[StandardOutputContent, StandardErrorContent]' \
                --output text
              exit 0
            fi
            if [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --region "${EC2_REGION}" \
                --query '[StandardOutputContent, StandardErrorContent]' \
                --output text
              exit 1
            fi
            sleep 10
          done
          echo "SSM command timed out waiting for completion"
          exit 1

      - name: Smoke test (public health)
        env:
          HEALTH_CHECK_URL: ${{ secrets.HEALTH_CHECK_URL }}
        run: |
          if [[ -z "$HEALTH_CHECK_URL" ]]; then
            echo "HEALTH_CHECK_URL not set — skipping smoke test"
            exit 0
          fi
          for i in $(seq 1 18); do
            if curl -sf "$HEALTH_CHECK_URL" | grep -q '"status":"UP"'; then
              echo "Health OK: $HEALTH_CHECK_URL"
              exit 0
            fi
            sleep 10
          done
          echo "Smoke test failed: $HEALTH_CHECK_URL"
          exit 1
